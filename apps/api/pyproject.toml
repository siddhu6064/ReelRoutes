[tool.poetry]
name = "reelroutes-api"
version = "4.0.0"
description = "ReelRoutes V4 — FastAPI backend"
authors = ["ReelRoutes Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"

# Web framework
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
python-multipart = "^0.0.9"

# MongoDB
motor = "^3.5.0"
beanie = "^1.26.0"

# Validation & settings
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"

# Auth — Clerk JWT verification
python-jose = {version = ">=3.3.0", extras = ["cryptography"]}
httpx = ">=0.27.0"

# Job queue
arq = "^0.26.0"
redis = ">=5.0.0"

# AI / LLM
openai = ">=1.40.0"

# Observability
sentry-sdk = {version = ">=2.0.0", extras = ["fastapi"]}
structlog = "^24.4.0"

# Utilities
python-ulid = "^2.7.0"

# Platform adapters
yt-dlp = ">=2024.8.0"
youtube-transcript-api = ">=0.6.2"
mutagen = "^1.47.0"
tiktoken = ">=0.7.0"
posthog = ">=3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
anyio = { extras = ["trio"], version = "^4.4.0" }
mongomock-motor = "^0.0.34"
ruff = "^0.6.0"
mypy = "^1.11.0"
types-python-jose = "^3.3.0"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "E501", "B008", "B904",
    "RUF001", "RUF002", "RUF003",
    # TCH: FastAPI resolves annotations via get_type_hints() at runtime,
    # so Pydantic models and other types can never be TYPE_CHECKING-only.
    "TCH001", "TCH002", "TCH003",
]

[tool.ruff.lint.per-file-ignores]
# Tests: pytest fixture injection looks like redefinition; fixtures look like unused args
"tests/**/*.py" = ["F811", "ARG001", "ARG002"]
# Adapters: interface methods must match signature even if not all params used
"app/adapters/*.py" = ["ARG002"]
# Extraction prompt: unicode characters in prompt strings are intentional
"app/services/extraction/prompt.py" = ["RUF001", "RUF002"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/workers/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
