name: CI

on:
  push:
    branches: ["siddhu6064", "main", "feature/**"]
  pull_request:
    branches: ["siddhu6064", "main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

# ─────────────────────────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────────────────────────
jobs:
  # ── 1. Python: format + lint ──────────────────────────────────
  lint-python:
    name: "Python · lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - uses: actions/cache@v4
        with:
          path: apps/api/.venv
          key: ${{ runner.os }}-py-${{ hashFiles('apps/api/poetry.lock') }}
          restore-keys: ${{ runner.os }}-py-

      - run: poetry install --no-interaction

      - name: "ruff · format check"
        run: poetry run ruff format --check .

      - name: "ruff · lint"
        run: poetry run ruff check . --output-format=github

  # ── 2. Python: test suite ─────────────────────────────────────
  test-api:
    name: "Python · tests"
    runs-on: ubuntu-latest
    # No MongoDB service — tests use mongomock-motor (in-memory)
    defaults:
      run:
        working-directory: apps/api
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - uses: actions/cache@v4
        with:
          path: apps/api/.venv
          key: ${{ runner.os }}-py-${{ hashFiles('apps/api/poetry.lock') }}
          restore-keys: ${{ runner.os }}-py-

      - run: poetry install --no-interaction

      - name: "pytest · full suite"
        run: poetry run pytest tests/ -q --tb=short --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: apps/api/coverage.xml
          flags: api
          fail_ci_if_error: false # don't fail CI if Codecov is down
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── 3. TypeScript: lint + typecheck (web + shared) ───────────
  lint-ts:
    name: "TypeScript · lint & typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter shared build

      - name: "eslint · web"
        run: pnpm --filter web lint

      - name: "tsc · web"
        run: pnpm --filter web typecheck

      - name: "tsc · shared"
        run: pnpm --filter shared typecheck

      - name: "prettier · format check"
        run: pnpm format:check

  # ── 4. TypeScript: typecheck mobile ──────────────────────────
  typecheck-mobile:
    name: "TypeScript · mobile"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # mobile has its own tsconfig that references the shared package
      - name: Build shared
        run: pnpm --filter shared build

      - name: "tsc · mobile"
        working-directory: apps/mobile
        run: pnpm exec tsc --noEmit

  # ── 5. TypeScript: shared unit tests ─────────────────────────
  test-shared:
    name: "TypeScript · shared tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter shared build

      - name: "vitest · shared"
        run: pnpm --filter shared test

  # ── 6. Build: web production build ───────────────────────────
  build-web:
    name: "Build · web"
    runs-on: ubuntu-latest
    needs: [lint-ts, test-shared]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter shared build

      - name: "vite build · web"
        run: pnpm --filter web build
        env:
          # Real keys injected in production — placeholder lets the build
          # complete without crashing on missing env vars
          VITE_API_URL: https://api.reelroutes.app
          VITE_GOOGLE_MAPS_API_KEY: placeholder
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder

  # ── Gate: all required jobs must pass ────────────────────────
  ci:
    name: "CI · all green"
    runs-on: ubuntu-latest
    needs:
      - lint-python
      - test-api
      - lint-ts
      - typecheck-mobile
      - test-shared
      - build-web
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          results=(
            "${{ needs.lint-python.result }}"
            "${{ needs.test-api.result }}"
            "${{ needs.lint-ts.result }}"
            "${{ needs.typecheck-mobile.result }}"
            "${{ needs.test-shared.result }}"
            "${{ needs.build-web.result }}"
          )
          failed=0
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              failed=1
            fi
          done
          if [[ $failed -eq 1 ]]; then
            echo "❌ One or more required jobs failed"
            exit 1
          fi
          echo "✅ All jobs passed"
